name: Update GitHub Streak Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: denvercoder1/github-readme-streak-stats@main
        with:
          user: hermona42
          theme: dark
          background: 0D1117
          ring: 00FF41
          fire: 00FF41
          currStreakLabel: 00FF41
          output: profile-streak-stats.svg

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update streak stats SVG"
          file_pattern: "*.svg"
