name: Update GitHub Streak Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Streak Stats SVG
        uses: denvercoder1/github-readme-streak-stats@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          user: hermona42
          theme: dark
          background: '0D1117'
          border: '00FF41'
          stroke: '00FF41'
          ring: '00FF41'
          fire: '00FF41'
          currStreakNum: '00FF41'
          sideNums: 'FFFFFF'
          currStreakLabel: '00FF41'
          sideLabels: '9E9E9E'
          dates: '9E9E9E'
          hide_border: 'false'

      - name: Pull latest remote changes
        run: git pull origin main --rebase

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update streak stats SVG theme"
          file_pattern: "*.svg profile/*.svg"
